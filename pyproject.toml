[project]
name = "regnskapnoter-taxonomy"
version = "1.0.0"
description = "Norwegian regnskap noter concept taxonomy with verbatim definitions, calculation arcs, and IFRS-Full mappings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Sondre Skarsten" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "markdown-it-py>=3.0",
    "click>=8.1",
]

[project.optional-dependencies]
xbrl = ["arelle-release>=2.20"]
test = ["pytest>=8.0", "pytest-cov>=4.1"]
dev = ["ruff>=0.4", "pre-commit>=3.6"]

[project.scripts]
rnt-build = "build.cli:main"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["build*"]
