name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Ruff lint
        run: ruff check build/ tests/

      - name: Ruff format check
        run: ruff format --check build/ tests/

      - name: JSON Schema validation
        run: python -m build.validate_jsonschema

      - name: Referential integrity
        run: python -m build.validate_referential

      - name: Build Parquet
        run: python -m build.build_parquet

      - name: Build Turtle and JSON-LD
        run: |
          python -m build.build_turtle --version "0.0.0-ci"
          python -m build.build_jsonld --version "0.0.0-ci"

      - name: SHACL validation
        run: python -m build.validate_shacl

      - name: Parquet/RDF parity
        run: python -m build.check_parquet_rdf_parity

      - name: Tests
        run: pytest tests/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
          if-no-files-found: ignore
