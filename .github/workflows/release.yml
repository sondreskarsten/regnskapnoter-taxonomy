name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev,xbrl]"

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: python -m build.release --version "${{ steps.ver.outputs.version }}"

      - name: Build XBRL package zip
        run: python -m build.build_xbrl --version "${{ steps.ver.outputs.version }}" --emit-package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.parquet
            artifacts/taxonomy.ttl
            artifacts/taxonomy.jsonld
            artifacts/release-manifest.json
            artifacts/regnskap-no-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
