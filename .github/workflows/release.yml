name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,xbrl]"

      - name: Validate
        run: |
          python -m build.validate_jsonschema
          python -m build.validate_referential

      - name: Build artifacts
        run: |
          python -m build.build_parquet
          python -m build.build_turtle
          python -m build.build_jsonld

      - name: SHACL validate
        run: python -m build.validate_shacl

      - name: Parquet/RDF parity
        run: python -m build.check_parquet_rdf_parity

      - name: Build XBRL package
        run: python -m build.build_xbrl

      - name: Validate XBRL with arelle
        run: python -m build.validate_xbrl

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release manifest
        run: |
          python -c "
          import json, hashlib, os
          from pathlib import Path
          from datetime import date
          art = Path('artifacts')
          files = sorted(p for p in art.iterdir() if p.is_file() and p.name not in {'.gitkeep', 'release-manifest.json'})
          manifest = {
              'version': '${{ steps.ver.outputs.version }}',
              'released': date.today().isoformat(),
              'git_commit': os.environ.get('GITHUB_SHA', ''),
              'artifacts': [
                  {'name': p.name, 'size_bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ],
          }
          (art / 'release-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True))
          print(json.dumps(manifest, indent=2, sort_keys=True))
          "

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.parquet
            artifacts/taxonomy.ttl
            artifacts/taxonomy.jsonld
            artifacts/release-manifest.json
          generate_release_notes: true
